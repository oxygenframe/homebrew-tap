# Keeps the formula on the latest oxframe-cli release: checks every hour,
# rewrites Formula/oxframe.rb when a new release is out, installs it from
# this tap on macOS and Linux, then pushes.
name: update
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - run: ./update.sh
      - id: diff
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: formula, path: Formula/oxframe.rb }

  test:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    strategy:
      matrix: { os: [macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - uses: actions/download-artifact@v4
        with: { name: formula, path: formula }
      - name: Install from a local copy of the tap
        run: |
          tap="$(brew --repository)/Library/Taps/oxygenframe/homebrew-tap"
          mkdir -p "$tap/Formula" && cp formula/oxframe.rb "$tap/Formula/"
          brew install --formula oxygenframe/tap/oxframe
          brew test oxygenframe/tap/oxframe
          oxframe --version

  push:
    needs: [update, test]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: formula, path: Formula }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "oxframe $(grep -m1 '^  version' Formula/oxframe.rb | cut -d'"' -f2)"
          git push
